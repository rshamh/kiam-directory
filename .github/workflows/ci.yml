name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # PostGIS, not plain Postgres — the suite runs against the real database
      # types. pg_trgm and postgis are created in the "Enable extensions" step,
      # because CREATE EXTENSION needs superuser and the app role is not one.
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: kiam_directory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-key
      DATABASE_URL: postgis://postgres:postgres@localhost:5432/kiam_directory
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # GeoDjango loads these through ctypes at import time. Debian's packages
      # land on the default linker path, so no GDAL_LIBRARY_PATH is needed.
      - name: Install GDAL and GEOS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev

      # kiam-ui is a private repo installed over SSH. CI carries no credentials
      # of its own, so a read-only deploy key is loaded into an agent before pip
      # runs — the key never reaches the working tree or a build layer.
      - name: Authorise the kiam-ui deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KIAM_UI_DEPLOY_KEY }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Enable Postgres extensions
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d kiam_directory \
            -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      # A model change committed without its migration passes the suite and
      # breaks the deploy. This is the cheapest place to catch it.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: pytest
        run: pytest -q

  build:
    # Proves the image still builds — including the SSH-mounted private
    # dependency and the node asset stage, neither of which the test job covers.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KIAM_UI_DEPLOY_KEY }}

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          ssh: default
          cache-from: type=gha
          cache-to: type=gha,mode=max
