[project]
name = "kiam-directory"
version = "0.1.0"
description = "Kiam Clinic Directory — directory.kiamclinic.com"
requires-python = ">=3.12"

dependencies = [
  # kiam-ui v1.1.0 itself requires >=5.2; the floor is raised to match so the
  # declared range cannot resolve to a Django the UI package will not run on.
  "Django>=5.2,<6.0",
  "psycopg[binary]>=3.2",
  "django-htmx>=1.19",
  "Pillow>=10.4",
  "django-environ>=0.11",
  "whitenoise>=6.7",
  "gunicorn>=23.0",
  "redis>=5.0",
  "django-storages[s3]>=1.14",
  "requests>=2.32",
  "sentry-sdk>=2.14",
  # TOTP 2FA for admin / verifier / superadmin. django-otp supplies the device
  # models and verification only — it does not own the login flow, which is
  # magic-link (see accounts/services/magic_link.py).
  "django-otp>=1.5",
  "qrcode>=8.0",
  # Argon2 is first in PASSWORD_HASHERS, so this is required, not optional —
  # without it Django raises on the first password hash.
  "argon2-cffi>=23.1",
  # Shared UI package. PINNED — upgrade deliberately, never track a branch.
  "kiam-ui @ git+ssh://git@github.com/rshamh/kiam-ui@v1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "pytest-cov>=5.0",
  "factory-boy>=3.3",
  # The verification sweep is entirely about dates crossing thresholds, so its
  # tests need a controllable clock rather than sleeps or relative offsets.
  "freezegun>=1.5",
  "ruff>=0.6",
  "django-debug-toolbar>=4.4",
  "django-stubs>=5.0",
]

[tool.setuptools]
# This is a Django project, not a distributable library: manage.py runs every
# app off the working directory on sys.path, so nothing here is ever imported as
# the "kiam-directory" package. `pip install -e .` exists only to install the
# [project.dependencies] list.
#
# Left to auto-discovery, setuptools scans the repo root for top-level packages
# to include in the distribution. With a dozen app directories (accounts,
# directory, seo, pages, search, dashboard, backoffice, config...) it cannot
# guess which are "the package" and refuses outright:
#
#   error: Multiple top-level packages discovered in a flat-layout: [...]
#
# This passed locally the first time only because it was run before most of
# those directories existed, then failed in CI against the full tree — a good
# example of why "works on my machine" isn't proof for a from-scratch install.
# `py-modules = []` tells setuptools there is nothing to discover, so the build
# succeeds and installs only the dependencies, which is all this ever needed.
py-modules = []

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# apps/accounts/models.py is AUTHORED ELSEWHERE and adopted verbatim — CLAUDE.md and
# docs/roadmap.md both say "review, don't rewrite". It is kept byte-identical to
# what was supplied, so the divergence is recorded here rather than absorbed
# silently by editing the file.
#
# DJ008: `LoginToken` and `Invite` define no __str__. Proposed upstream, not
# applied. Note a __str__ on either is not free — both hold a token_hash, and the
# obvious implementation puts a credential-shaped string into admin pages and log
# lines. If one is added it should render the user and the timestamp, never the
# hash.
"apps/accounts/models.py" = ["DJ008"]
# apps/directory/models.py is authored elsewhere too and adopted essentially verbatim
# (docs/roadmap.md Phase 1: "already written — review, don't rewrite"). The two
# edits it did need are commented in place and were both blockers, not tidying:
# a field named `check` that Django refuses outright, and `storage=None` on the
# evidence FileField, which resolved to the PUBLIC bucket.
#
# DJ008: twelve models define no __str__. Proposed upstream, not applied —
# adding them is a real improvement but it is a change to every model in the
# file, which is exactly what "review, don't rewrite" is protecting against.
"apps/directory/models.py" = ["DJ008"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--reuse-db --strict-markers"
